baseURL: "https://vi-dev.org/nem-cli/"
title: nem

enableInlineShortcodes: true
enableRobotsTXT: true
enableGitInfo: true

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Docs
      pageRef: /docs/getting-started
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/vi-dev/nem-cli"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/nem-mark-ink.svg
      dark: images/nem-mark.svg
      width: 24
      height: 24
  theme:
    default: system
    displayToggle: true
  editURL:
    enable: true
    base: "https://github.com/vi-dev/nem-cli/edit/main/website/content"
  footer:
    enable: true
    displayCopyright: true
